<div class="card" id="van-cadastro-card">
  <h2>RF005 — Cadastrar Van</h2>

  <form [formGroup]="vanForm" (ngSubmit)="onSubmit()" id="form-van">
    <div>
      <label for="placa">Placa</label>
      <input id="input-placa" data-qa="input-placa" formControlName="placa" />
    </div>

    <div>
      <label for="renavam">Renavam</label>
      <input id="input-renavam" data-qa="input-renavam" formControlName="renavam" />
    </div>

    <div>
      <label for="marcaModelo">Marca/Modelo</label>
      <input id="input-marca" data-qa="input-marca" formControlName="marcaModelo" />
    </div>

    <div>
      <label for="tipo">Tipo</label>
      <input id="input-tipo" data-qa="input-tipo" formControlName="tipo" />
    </div>

    <div>
      <label for="especie">Espécie</label>
      <input id="input-especie" data-qa="input-especie" formControlName="especie" />
    </div>

    <div>
      <label for="combustivel">Combustível</label>
      <input id="input-combustivel" data-qa="input-combustivel" formControlName="combustivel" />
    </div>

    <div>
      <label for="anoModelo">Ano Modelo</label>
      <input id="input-anoModelo" data-qa="input-anoModelo" type="number" formControlName="anoModelo" />
    </div>

    <div>
      <label for="anoFabricacao">Ano Fabricação</label>
      <input id="input-anoFabricacao" data-qa="input-anoFabricacao" type="number" formControlName="anoFabricacao" />
    </div>

    <div>
      <label for="potencia">Potência (cv)</label>
      <input id="input-potencia" data-qa="input-potencia" type="number" formControlName="potencia" />
    </div>

    <div>
      <label for="cilindradas">Cilindradas</label>
      <input id="input-cilindradas" data-qa="input-cilindradas" type="number" formControlName="cilindradas" />
    </div>

    <div>
      <label for="empresaId">Vincular à Empresa (opcional)</label>
      <select id="select-empresa" data-qa="select-empresa" formControlName="empresaId">
        <option value="">-- Nenhuma --</option>
        <option *ngFor="let e of empresas" [value]="e.id">{{ e.nome }}</option>
      </select>
    </div>

    <button id="btn-salvar-van" data-qa="btn-salvar-van" type="submit">Salvar Van</button>
  </form>

  <p id="savedMsg" *ngIf="savedMsg">{{ savedMsg }}</p>

  <hr />

  <h3>Vans Cadastradas</h3>
  <table id="table-vans" data-qa="table-vans" border="1">
    <thead><tr><th>Placa</th><th>Marca/Modelo</th><th>Empresa</th><th>Ações</th></tr></thead>
    <tbody>
      <tr *ngFor="let v of vans" data-qa="row-van-{{v.id}}">
        <td>{{v.placa}}</td>
        <td>{{v.marcaModelo}}</td>
        <td>{{ v.empresaId ? (empresas.find(x => x.id===v.empresaId)?.nome) : '—' }}</td>
        <td>
          <button data-qa="btn-delete-van-{{v.id}}" (click)="removeVan(v.id)">Remover</button>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Robot hook -->
  <div id="lastCreatedVanId" style="display:none"></div>
</div>
